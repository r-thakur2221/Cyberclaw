
services:
  ollama:
    image: ollama/ollama:0.40.14
    container_name: cyberclaw-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "16384"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - cyberclaw-net

  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.9.3
    container_name: cyberclaw-gateway
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:18789:18789"
    environment:
      HOME: /home/node
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Set token in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in environment/.env}
      OLLAMA_API_KEY: ollama-local
    volumes:
      - ./config:/home/node/.openclaw
      - ./workspace:/home/node/.openclaw/workspace
    command:
      - node
      - openclaw.mjs
      - gateway
      - run
      - --bind
      - lan
      - --port
      - "18789"
      - --auth
      - token
    networks:
      - cyberclaw-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  cyberclaw-net:
    driver: bridge

volumes:
  ollama_data:

